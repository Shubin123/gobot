[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gobot"
version = "1.0.0"
description = "Dual-headed ResNet Go engine with MCTS, GTP, self-play training, and a browser extension"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GoBot Team" }]
requires-python = ">=3.11"
keywords = ["go", "baduk", "weiqi", "neural-network", "mcts", "alphago", "game-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "ruff>=0.4.0",
]

[project.scripts]
gobot = "cli:main"

[project.urls]
Homepage = "https://shubin123.github.io/gobot"
Repository = "https://github.com/Shubin123/gobot"
Issues = "https://github.com/Shubin123/gobot/issues"

[tool.setuptools.packages.find]
include = ["gobot_engine*", "training_pipeline*", "online_extension*"]

[tool.setuptools.package-data]
"online_extension" = ["web_ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: fast sanity checks (< 2s each)",
    "integration: multi-module integration tests",
    "e2e: full end-to-end game and API tests",
    "slow: tests that take > 10s",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
